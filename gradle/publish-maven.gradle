apply plugin: 'maven-publish'

publishing {
	publications {
		mavenJava(MavenPublication) {
			pom {
				afterEvaluate {
					name = project.description
					description = project.description
				}
				url = linkScmUrl
				organization {
					name = 'Spring IO'
					url = 'https://spring.io/projects/spring-integration'
				}
				licenses {
					license {
						name = 'Apache License, Version 2.0'
						url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
						distribution = 'repo'
					}
				}
				scm {
					url = linkScmUrl
					connection = linkScmConnection
					developerConnection = linkScmDevConnection
				}
				developers {
					developer {
						id = 'artembilan'
						name = 'Artem Bilan'
						email = 'artem.bilan@broadcom.com'
						roles = ['project lead']
					}
					developer {
						id = 'garyrussell'
						name = 'Gary Russell'
						email = 'github@gprussell.net'
						roles = ['project lead emeritus']
					}
					developer {
						id = 'markfisher'
						name = 'Mark Fisher'
						email = 'mark.ryan.fisher@gmail.com'
						roles = ['project founder and lead emeritus']
					}
				}
				issueManagement {
					system = 'GitHub'
					url = linkIssue
				}
			}
			versionMapping {
				usage('java-api') {
					fromResolutionResult()
				}
				usage('java-runtime') {
					fromResolutionResult()
				}
			}
		}
	}
}

// RxLogix Nexus: configured from the environment so no credentials live in the repo
// (same NEXUS_* variables as the other RxLogix forks). Publish with publishAllPublicationsToNexusRepository.
String nexusUrl = System.getenv("NEXUS_URL")
if (nexusUrl) {
	publishing.repositories.maven {
		name = "nexus"
		url = nexusUrl
		allowInsecureProtocol = Boolean.parseBoolean(System.getenv("NEXUS_ALLOW_INSECURE_PROTOCOL"))
		credentials {
			username = System.getenv("NEXUS_USERNAME")
			password = System.getenv("NEXUS_PASSWORD")
		}
	}
}
